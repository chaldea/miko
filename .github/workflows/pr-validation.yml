name: PR Validation

# Validate that pull requests targeting main compile successfully.
# Configure this workflow as a required status check in branch protection
# so failures block merging.

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    # macos-latest can build desktop, Android, iOS and WebAssembly projects,
    # so the whole solution (including the mobile libraries and browser demo)
    # is validated in a single job.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # The SDK pinned in global.json (11.0.1xx, latest patch), matching the workloads below.
          global-json-file: global.json

      # setup-dotnet installs the SDK, not the native WebAssembly toolchain required by the demo.
      - name: Install mobile and WebAssembly workloads
        run: dotnet workload install android ios wasm-tools

      # Build the whole solution. miko.slnx includes the mobile libraries and browser demo,
      # which the macOS runner can compile thanks to the workloads above.
      - name: Build solution (Release)
        run: dotnet build miko.slnx -c Release

      # Run every test project in the solution, not just Miko.Tests. `dotnet test` on the
      # solution picks up the projects carrying Microsoft.NET.Test.Sdk and skips the rest,
      # so new test projects are covered without touching this workflow. --no-build reuses the
      # Release output from the step above instead of compiling the solution a second time.
      - name: Run tests
        run: dotnet test miko.slnx -c Release --no-build

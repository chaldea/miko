name: Deploy Docs

# One static artifact: documentation at / and the WebAssembly demo at /demo/.
# Settings > Pages > Build and deployment > Source must be GitHub Actions.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/Miko.Docs/**'
      - 'tests/Miko.Docs.Tests/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/Miko.Docs/**'
      - 'tests/Miko.Docs.Tests/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    name: Publish documentation and WebAssembly demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # setup-dotnet installs the SDK, not the Emscripten/native WASM toolchain.
      # Keep this available for the full demo when it enables native linking/AOT.
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v4

      - name: Publish static site
        env:
          PAGES_BASE_PATH: ${{ github.event_name == 'pull_request' && '/miko' || steps.pages.outputs.base_path }}
        run: >-
          dotnet publish docs/Miko.Docs.Web/Miko.Docs.Web.csproj
          -c Release -o artifacts/docs
          -p:MikoDocsBasePath="${PAGES_BASE_PATH%/}/"

      - name: Verify deployment layout
        shell: pwsh
        env:
          PAGES_BASE_PATH: ${{ github.event_name == 'pull_request' && '/miko' || steps.pages.outputs.base_path }}
        run: ./docs/Verify-Publish.ps1 -SiteRoot artifacts/docs/wwwroot -BasePath "$($env:PAGES_BASE_PATH.TrimEnd('/'))/"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/docs/wwwroot

      # Also verify an explicit native build at the root deployment path.
      - name: Publish root deployment with native WebAssembly
        if: github.event_name == 'pull_request'
        run: dotnet publish docs/Miko.Docs.Web/Miko.Docs.Web.csproj -c Release -o artifacts/docs-root -p:MikoDocsBasePath=/ -p:WasmBuildNative=true

      - name: Verify root deployment
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./docs/Verify-Publish.ps1 -SiteRoot artifacts/docs-root/wwwroot -BasePath /

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

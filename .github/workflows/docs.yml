name: Deploy Docs

# One static artifact: documentation at / and the WebAssembly demo at /demo/.
# Settings > Pages > Build and deployment > Source must be GitHub Actions.
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/Miko.Docs/**'
      - 'tests/Miko.Docs.Tests/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Publish documentation and WebAssembly demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Publish static site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: >-
          dotnet publish docs/Miko.Docs.Web/Miko.Docs.Web.csproj
          -c Release -o artifacts/docs
          -p:MikoDocsBasePath="${PAGES_BASE_PATH%/}/"

      - name: Verify deployment layout
        shell: pwsh
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: ./docs/Verify-Publish.ps1 -SiteRoot artifacts/docs/wwwroot -BasePath "$($env:PAGES_BASE_PATH.TrimEnd('/'))/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/docs/wwwroot

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
